<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #fff; stroke: #222; stroke-width: 2; }
    .box { fill: #fff; stroke: #555; stroke-width: 1.5; }
    .sel { fill: #222; }
    .bar { fill: #d6d6d6; }
    .title { font-size: 22px; font-weight: 700; fill: #222; }
    .t { font-size: 14px; fill: #222; }
    .tw { font-size: 14px; fill: #fff; }
    .ts { font-size: 11px; fill: #666; }
    .tsw { font-size: 11px; fill: #ddd; }
    .ann { font-size: 13px; fill: #1f5fbf; }
    .lead { stroke: #1f5fbf; stroke-width: 1; }
    .fig { fill: none; stroke: #444; stroke-width: 2; }
    .ico { fill: none; stroke: #444; stroke-width: 1.5; }
    .icow { fill: none; stroke: #fff; stroke-width: 1.5; }
  </style>
  <defs>
    <clipPath id="stripClip"><rect x="60" y="545" width="260" height="60"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1320" height="980" fill="#fafafa"/>

  <!-- ================= PHONE ================= -->
  <text x="40" y="50" class="title">Phone</text>
  <rect x="40" y="70" width="300" height="700" rx="24" class="frame"/>

  <!-- header: active place + date -->
  <text x="60" y="104" font-size="18" font-weight="700" fill="#222">Austin</text>
  <text x="60" y="124" class="ts">Today · Mon, Oct 5 · °F</text>

  <!-- weather card -->
  <rect x="60" y="140" width="260" height="150" rx="12" class="box"/>
  <text x="190" y="160" class="ts" text-anchor="middle">Current conditions</text>
  <g transform="translate(190 196)" class="ico" stroke-width="2">
    <circle r="12"/>
    <path d="M0 -18v-6M0 18v6M-18 0h-6M18 0h6M-13 -13l-4 -4M13 13l4 4M-13 13l-4 4M13 -13l4 -4"/>
  </g>
  <text x="190" y="252" font-size="30" text-anchor="middle" fill="#222">83°</text>
  <text x="103" y="272" class="ts" text-anchor="middle">Feels like</text>
  <text x="190" y="272" class="ts" text-anchor="middle">Humidity</text>
  <text x="277" y="272" class="ts" text-anchor="middle">Wind</text>
  <text x="103" y="285" class="ts" text-anchor="middle">—</text>
  <text x="190" y="285" class="ts" text-anchor="middle">—</text>
  <text x="277" y="285" class="ts" text-anchor="middle">—</text>

  <!-- character -->
  <g class="fig">
    <circle cx="190" cy="330" r="22"/>
    <rect x="162" y="356" width="56" height="74" rx="14"/>
    <path d="M176 430v36M204 430v36M162 368l-18 40M218 368l18 40"/>
  </g>
  <rect x="80" y="486" width="220" height="9" rx="4" class="bar"/>
  <rect x="110" y="503" width="160" height="9" rx="4" class="bar"/>

  <!-- bottom control dock -->
  <line x1="40" y1="530" x2="340" y2="530" stroke="#ccc"/>
  <g clip-path="url(#stripClip)">
    <rect x="60" y="545" width="56" height="60" rx="10" class="sel"/>
    <text x="88" y="563" class="tsw" text-anchor="middle">Today</text>
    <circle cx="88" cy="577" r="6" class="icow"/>
    <text x="88" y="598" class="tsw" text-anchor="middle">83°</text>
    <g>
      <rect x="124" y="545" width="56" height="60" rx="10" class="box"/>
      <text x="152" y="563" class="ts" text-anchor="middle">Tue</text>
      <circle cx="152" cy="577" r="6" class="ico"/>
      <text x="152" y="598" class="ts" text-anchor="middle">81°</text>
    </g>
    <g>
      <rect x="188" y="545" width="56" height="60" rx="10" class="box"/>
      <text x="216" y="563" class="ts" text-anchor="middle">Wed</text>
      <path d="M208 584a5 5 0 0 1 1 -10a7 7 0 0 1 13 -1a5 5 0 0 1 2 11z" class="ico"/>
      <text x="216" y="598" class="ts" text-anchor="middle">76°</text>
    </g>
    <g>
      <rect x="252" y="545" width="56" height="60" rx="10" class="box"/>
      <text x="280" y="563" class="ts" text-anchor="middle">Thu</text>
      <path d="M272 582a5 5 0 0 1 1 -10a7 7 0 0 1 13 -1a5 5 0 0 1 2 11zM276 585l-2 3M282 585l-2 3" class="ico"/>
      <text x="280" y="598" class="ts" text-anchor="middle">72°</text>
    </g>
    <rect x="316" y="545" width="56" height="60" rx="10" class="box"/>
    <rect x="286" y="545" width="34" height="60" fill="url(#fade)"/>
  </g>

  <rect x="60" y="620" width="200" height="44" rx="10" class="box"/>
  <rect x="62" y="622" width="98" height="40" rx="8" class="sel"/>
  <text x="111" y="647" class="tw" text-anchor="middle">✓ Austin</text>
  <text x="210" y="647" class="t" text-anchor="middle">LA</text>
  <rect x="268" y="620" width="52" height="44" rx="10" class="box"/>
  <text x="294" y="647" class="t" text-anchor="middle">✎</text>

  <text x="190" y="700" class="t" text-anchor="middle" text-decoration="underline">Credits</text>

  <!-- phone annotations -->
  <g class="lead">
    <line x1="150" y1="112" x2="368" y2="112"/>
    <line x1="324" y1="215" x2="368" y2="215"/>
    <line x1="240" y1="400" x2="368" y2="400"/>
    <line x1="304" y1="498" x2="368" y2="498"/>
    <line x1="324" y1="575" x2="368" y2="575"/>
    <line x1="324" y1="642" x2="368" y2="642"/>
    <line x1="230" y1="696" x2="368" y2="696"/>
  </g>
  <text x="374" y="108" class="ann">Header: active place, date,</text>
  <text x="374" y="124" class="ann">units (read-only)</text>
  <text x="374" y="211" class="ann">Weather card, labelled</text>
  <text x="374" y="227" class="ann">current or forecast</text>
  <text x="374" y="404" class="ann">Character (avatar)</text>
  <text x="374" y="502" class="ann">Clothing description</text>
  <text x="374" y="565" class="ann">Day strip: 7 days, swipe</text>
  <text x="374" y="581" class="ann">sideways; replaces ◁ ▷</text>
  <text x="374" y="597" class="ann">(fade = more days)</text>
  <text x="374" y="638" class="ann">Two-city switch + ✎ Change,</text>
  <text x="374" y="654" class="ann">in thumb reach</text>
  <text x="374" y="700" class="ann">Credits (opens popup)</text>

  <!-- ================= LAPTOP ================= -->
  <text x="620" y="50" class="title">Laptop</text>
  <rect x="620" y="70" width="660" height="470" rx="12" class="frame"/>

  <!-- header row -->
  <text x="645" y="104" font-size="18" font-weight="700" fill="#222">Austin</text>
  <text x="645" y="124" class="ts">Today · Mon, Oct 5 · °F</text>
  <rect x="1000" y="88" width="190" height="40" rx="10" class="box"/>
  <rect x="1002" y="90" width="93" height="36" rx="8" class="sel"/>
  <text x="1048" y="113" class="tw" text-anchor="middle">✓ Austin</text>
  <text x="1142" y="113" class="t" text-anchor="middle">LA</text>
  <rect x="1198" y="88" width="57" height="40" rx="10" class="box"/>
  <text x="1226" y="113" class="t" text-anchor="middle">✎</text>

  <!-- full 7-day strip -->
  <g>
    <rect x="645" y="145" width="80" height="64" rx="10" class="sel"/>
    <text x="685" y="165" class="tsw" text-anchor="middle">Today</text>
    <circle cx="685" cy="180" r="6" class="icow"/>
    <text x="685" y="200" class="tsw" text-anchor="middle">83°</text>
  </g>
  <g class="days">
    <rect x="733" y="145" width="80" height="64" rx="10" class="box"/>
    <text x="773" y="165" class="ts" text-anchor="middle">Tue</text>
    <circle cx="773" cy="180" r="6" class="ico"/>
    <text x="773" y="200" class="ts" text-anchor="middle">81°</text>
    <rect x="821" y="145" width="80" height="64" rx="10" class="box"/>
    <text x="861" y="165" class="ts" text-anchor="middle">Wed</text>
    <path d="M853 187a5 5 0 0 1 1 -10a7 7 0 0 1 13 -1a5 5 0 0 1 2 11z" class="ico"/>
    <text x="861" y="200" class="ts" text-anchor="middle">76°</text>
    <rect x="909" y="145" width="80" height="64" rx="10" class="box"/>
    <text x="949" y="165" class="ts" text-anchor="middle">Thu</text>
    <path d="M941 185a5 5 0 0 1 1 -10a7 7 0 0 1 13 -1a5 5 0 0 1 2 11zM945 188l-2 3M951 188l-2 3" class="ico"/>
    <text x="949" y="200" class="ts" text-anchor="middle">72°</text>
    <rect x="997" y="145" width="80" height="64" rx="10" class="box"/>
    <text x="1037" y="165" class="ts" text-anchor="middle">Fri</text>
    <circle cx="1037" cy="180" r="6" class="ico"/>
    <text x="1037" y="200" class="ts" text-anchor="middle">79°</text>
    <rect x="1085" y="145" width="80" height="64" rx="10" class="box"/>
    <text x="1125" y="165" class="ts" text-anchor="middle">Sat</text>
    <circle cx="1125" cy="180" r="6" class="ico"/>
    <text x="1125" y="200" class="ts" text-anchor="middle">84°</text>
    <rect x="1173" y="145" width="82" height="64" rx="10" class="box"/>
    <text x="1214" y="165" class="ts" text-anchor="middle">Sun</text>
    <path d="M1206 187a5 5 0 0 1 1 -10a7 7 0 0 1 13 -1a5 5 0 0 1 2 11z" class="ico"/>
    <text x="1214" y="200" class="ts" text-anchor="middle">80°</text>
  </g>

  <!-- left: weather card -->
  <rect x="645" y="228" width="300" height="250" rx="12" class="box"/>
  <text x="795" y="252" class="ts" text-anchor="middle">Current conditions</text>
  <g transform="translate(795 300)" class="ico" stroke-width="2">
    <circle r="14"/>
    <path d="M0 -20v-7M0 20v7M-20 0h-7M20 0h7M-14 -14l-5 -5M14 14l5 5M-14 14l-5 5M14 -14l5 -5"/>
  </g>
  <text x="795" y="372" font-size="34" text-anchor="middle" fill="#222">83°</text>
  <text x="700" y="430" class="ts" text-anchor="middle">Feels like</text>
  <text x="795" y="430" class="ts" text-anchor="middle">Humidity</text>
  <text x="890" y="430" class="ts" text-anchor="middle">Wind</text>
  <text x="700" y="446" class="ts" text-anchor="middle">—</text>
  <text x="795" y="446" class="ts" text-anchor="middle">—</text>
  <text x="890" y="446" class="ts" text-anchor="middle">—</text>

  <!-- right: character -->
  <g class="fig">
    <circle cx="1105" cy="262" r="28"/>
    <rect x="1070" y="296" width="70" height="96" rx="16"/>
    <path d="M1088 392v44M1122 392v44M1070 310l-22 50M1140 310l22 50"/>
  </g>
  <rect x="1000" y="452" width="210" height="9" rx="4" class="bar"/>
  <rect x="1030" y="469" width="150" height="9" rx="4" class="bar"/>

  <text x="950" y="520" class="t" text-anchor="middle" text-decoration="underline">Credits</text>

  <!-- ================= CHANGE PANEL ================= -->
  <text x="620" y="600" class="title">Change location</text>
  <rect x="620" y="620" width="320" height="300" rx="16" class="frame"/>
  <rect x="755" y="630" width="50" height="5" rx="2.5" fill="#bbb"/>
  <text x="640" y="664" class="t" font-weight="700">Replace “Austin”</text>
  <text x="916" y="664" font-size="16" fill="#222">×</text>
  <rect x="640" y="682" width="280" height="44" rx="8" class="box"/>
  <text x="656" y="709" class="t" style="fill:#888">US city or ZIP</text>
  <rect x="640" y="738" width="280" height="44" rx="8" class="box"/>
  <g transform="translate(664 760)" class="ico"><circle r="7"/><circle r="2" fill="#444"/><path d="M0 -11v3M0 8v3M-11 0h3M8 0h3"/></g>
  <text x="682" y="765" class="t">Use my location</text>
  <text x="640" y="812" class="ts">Results</text>
  <rect x="640" y="822" width="220" height="9" rx="4" class="bar"/>
  <rect x="640" y="842" width="180" height="9" rx="4" class="bar"/>
  <text x="640" y="890" class="ts">If location is denied: short message here,</text>
  <text x="640" y="905" class="ts">search stays available.</text>
  <line x1="944" y1="664" x2="980" y2="664" class="lead"/>
  <text x="986" y="660" class="ann">Opens from ✎. Bottom sheet on</text>
  <text x="986" y="676" class="ann">phone, dropdown on laptop.</text>
  <text x="986" y="692" class="ann">Replaces the selected city.</text>

  <!-- ================= CREDITS POPUP ================= -->
  <text x="986" y="760" class="title">Credits popup</text>
  <rect x="986" y="776" width="270" height="144" rx="12" class="frame"/>
  <text x="1004" y="802" class="t" font-weight="700">Credits</text>
  <text x="1232" y="802" font-size="16" fill="#222">×</text>
  <line x1="986" y1="814" x2="1256" y2="814" stroke="#ccc"/>
  <rect x="1004" y="830" width="210" height="9" rx="4" class="bar"/>
  <rect x="1004" y="848" width="160" height="9" rx="4" class="bar"/>
  <rect x="1004" y="874" width="220" height="9" rx="4" class="bar"/>
  <rect x="1004" y="892" width="140" height="9" rx="4" class="bar"/>

  <text x="40" y="820" class="ts">v2: redrawn from the hand sketch with a revised location control and date picker.</text>
  <text x="40" y="836" class="ts">Day temperatures are placeholders. Reminders, error states and required labels still to be placed.</text>
</svg>
